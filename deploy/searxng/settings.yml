# SearXNG settings — minimal config for campus activity platform
# Only used engines: google, bing, duckduckgo, baidu
use_default_settings: true
general:
  instance_name: "Campus Activity Search"
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  secret_key: "0786ca2220d16cc5a6a35f5a07dad80ba4786d2fc61a0287394894cc57b6485e"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  # Disable link token check — we access API directly from backend
  link_token: false
ui:
  static_use_hash: false
  default_theme: simple
  default_locale: zh-Hans-CN
  results_on_new_tab: false
# Only enable these engines, disable all others
engines:
  # Enabled engines
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: baidu
    disabled: false
