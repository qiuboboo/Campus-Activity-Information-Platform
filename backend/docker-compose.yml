services:
  api:
    build: .
    container_name: campus-activity-api
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: campus-activity-postgres
    environment:
      POSTGRES_DB: campus_activity
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: campus-activity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
