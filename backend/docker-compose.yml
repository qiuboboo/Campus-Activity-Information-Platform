    build: .
    container_name: campus-activity-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Containers use Alembic migrations instead of create_all().
      AUTO_CREATE_TABLES: "false"
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres
      - redis
