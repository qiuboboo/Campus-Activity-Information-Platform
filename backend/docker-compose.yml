>>>>>>> Stashed changes

  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: campus-activity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_activity
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123456
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB

  worker:
    build: .
    container_name: campus-activity-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=1 -Q crawl,ai,index,celery
    deploy:
      resources:
        limits:
          memory: 256M

  beat:
    build: .
    container_name: campus-activity-beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app.celery beat --loglevel=INFO
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - full

  redis:
    image: redis:7
    container_name: campus-activity-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

  copilot-proxy:
    image: node:20-slim
    container_name: campus-activity-copilot-proxy
    restart: unless-stopped
    working_dir: /data
    env_file:
      - .env
    command: sh -c "npx copilot-api-node20@latest start --openai --port 4141 --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:4141:4141"
    volumes:
      - copilot-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - full

volumes:
  postgres-data:
  redis-data:
  copilot-data:
  uploads-data:
