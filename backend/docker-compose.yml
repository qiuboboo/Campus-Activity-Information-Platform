services:
  api:
    build: .
    container_name: campus-activity-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: campus-activity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_activity
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123456
    volumes:
      - postgres-data:/var/lib/postgresql/data

  worker:
    build: .
    container_name: campus-activity-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=1

  beat:
    build: .
    container_name: campus-activity-beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app.celery beat --loglevel=INFO

  redis:
    image: redis:7
    container_name: campus-activity-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
